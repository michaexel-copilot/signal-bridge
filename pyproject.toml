[project]
name = "signal-bridge"
version = "0.1.0"
description = "Paper-trades Sentiment Research Center signals on the Paper Trading Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0",
]

[project.scripts]
bridge = "signal_bridge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
